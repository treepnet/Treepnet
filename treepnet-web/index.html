<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a11" />
    <meta name="description" content="Treepnet is a new social network for travelers and explorers. Pin your locations, post photos, and watch your gray profile map burst into vibrant color!" />
    <meta name="robots" content="max-image-preview:none" />
    <meta property="og:title" content="Treepnet — A travel-first social network" />
    <meta property="og:description" content="Every city you visit and share transforms your map. Make travel your lifestyle with Treepnet!" />
    <meta property="og:image" content="" />
    <meta property="og:type" content="website" />
    <title>Treepnet — Turn the whole world into your personal achievement map</title>
    <script>
      // iOS invite (/invite/<handle>): the App Store button first copies the
      // invite link, so the newly installed app can read it on first launch
      // (iOS has no install referrer; detectValues(.probableWebURL), no paste
      // prompt). Inline and on the document, so it works even when the main
      // script never loads (throttled networks). Organic visits: a plain link.
      document.addEventListener('click', function (e) {
        var m = location.pathname.match(/^\/invite\/([^/]+)\/?$/);
        var a = m && e.target.closest && e.target.closest('a[href^="https://apps.apple.com/"]');
        if (!a) return;
        e.preventDefault();
        var handle = null;
        try { handle = decodeURIComponent(m[1]).trim().toLowerCase(); } catch (_) {}
        // Only a username or an account id (as worker.js): a cut or mangled
        // link still goes to the store, just without an invite.
        if (!handle || !(/^[a-z0-9_.]{1,30}$/.test(handle) ||
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(handle))) {
          location.href = a.href;
          return;
        }
        var code = 'https://treepnet.com/invite/' + handle;
        try {
          // Synchronous copy: the only reliable way to copy and navigate
          // within one tap on iOS Safari.
          var ta = document.createElement('textarea');
          ta.value = code;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (_) {
          try { navigator.clipboard && navigator.clipboard.writeText(code); } catch (_) {}
        }
        location.href = a.href;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
