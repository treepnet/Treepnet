name: firebase_authentication_client
description: A Firebase (custom-token) implementation of AuthenticationClient.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.9.0"
  flutter: ">=3.0.0"

dependencies:
  authentication_client:
    path: ../authentication_client
  crypto: ^3.0.3
  dio: ^5.10.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  # Sign in with Google / Apple (social.js on the auth-service checks what
  # they give). sign_in_with_apple 8 needs Flutter 3.41.
  google_sign_in: ^7.2.0
  powersync_repository:
    path: ../../powersync_repository
  shared:
    path: ../../shared
  sign_in_with_apple: ^8.2.0
  token_storage:
    path: ../token_storage

dev_dependencies:
  mocktail: ^1.0.4
  test: ^1.25.5
  very_good_analysis: ^9.0.0
