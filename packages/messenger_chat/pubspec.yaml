name: messenger_chat
description: "Messenger uchun tayyor 1:1 chat UI komponenti - transportdan mustaqil."
version: 1.0.8+8
homepage: https://github.com/milliy/messenger_chat

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.0.0
  flutter_svg: ^2.2.0
  cached_network_image: ^4.0.7
  path_provider: ^2.1.5
  dio: ^5.8.0+1
  equatable: ^2.0.7
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.4
  skeletonizer: ^2.1.0+1
  visibility_detector: ^0.4.0+2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  any_link_preview: ^3.0.1
  url_launcher: ^6.3.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: uz.messenger.chat
        pluginClass: MessengerChatPlugin
      ios:
        pluginClass: MessengerChatPlugin

  assets:
    # The avatar placeholder; the rest went with the unused light/dark presets.
    - assets/images/profile_photo.png
