name: messenger_chat
description: "Messenger uchun tayyor 1:1 chat UI komponenti - transportdan mustaqil."
version: 1.0.8+8
homepage: https://github.com/milliy/messenger_chat

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.0.0
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  socket_io_client: ^3.1.2
  path_provider: ^2.1.5
  file_picker: ^10.2.0
  just_audio: ^0.10.4
  record: ^6.1.1
  path: ^1.9.1
  vector_math: ^2.1.4
  dio: ^5.8.0+1
  equatable: ^2.0.7
  intl: ^0.20.2
  audio_session: ^0.2.2
  flutter_bloc: ^9.1.1
  mime: ^2.0.0
  image_picker: ^1.1.2
  video_player: ^2.10.0
  flick_video_player: ^0.9.0
  open_filex: ^4.7.0
  flutter_secure_storage: ^9.2.4
  vibration: ^3.1.3
  permission_handler: ^12.0.1
  super_tooltip: ^2.1.0
  skeletonizer: ^2.1.0+1
  visibility_detector: ^0.4.0+2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  emoji_picker_flutter: ^3.0.0
  shared_preferences: ^2.2.0
  any_link_preview: ^3.0.1
  url_launcher: ^6.3.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: uz.messenger.chat
        pluginClass: MessengerChatPlugin
      ios:
        pluginClass: MessengerChatPlugin

  assets:
    - assets/icons/
    - assets/images/
