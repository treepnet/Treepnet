name: powersync_repository
description: A package that manages connection to the PowerSync cloud service and database.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.9.0"
  flutter: ">=3.35.7"

dependencies:
  env:
    path: ../env

  flutter:
    sdk: flutter
  http: ^1.5.0
  path: any
  path_provider: ^2.1.5
  # 2.x: one package for the whole SDK (powersync_core and
  # powersync_flutter_libs are gone); its native SQLite core comes through
  # build hooks, downloaded and hash-checked at build time. Only the Rust
  # sync client remains, the one Sync Streams need.
  powersync: ^2.6.2
  postgrest: ^2.4.2
  shared:
    path: ../shared
  # Reads a database PowerSync can't open (DatabaseWipe), read-only.
  sqlite3: ^3.9.2
  token_storage:
    path: ../authentication_client/token_storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
