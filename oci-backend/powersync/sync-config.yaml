# Sync Streams: https://docs.powersync.com/sync/streams/overview
#
# What a phone keeps:
#   * `me`        its own private rows: likes, saves, archive, follows both
#                 ways, blocks both ways, invites, who viewed its stories, its
#                 whole story archive, its notifications, its private profile
#                 fields (as the `my_profile` table);
#   * `authors`   the profile, counts, posts, stories, highlights, story pins
#                 and visited regions of the user and of everyone they follow
#                 (an accepted follow);
# and, while a screen asks for it (the app subscribes, see SyncScopes):
#   * `profile`       the same for a public profile open on screen;
#   * `profile_card`  any profile's card and counts (a private one too);
#   * `post`          a post, its counts and its comments, when the viewer may
#                     see it: their own, a followed author's, or a public one.
# Everything else — the feed past the people you follow, Trends, likers,
# followers lists, suggestions, saved posts — comes from the server
# (sql/sync_scoping.sql), which checks privacy and blocks itself.
#
# Until 2026-11 every phone synced every user's posts, likes, comments,
# stories, profiles and follows (global buckets), private accounts included.
#
# Buckets: `me` is one per user; `authors` one per author, shared by everyone
# who follows or opens that author (the `profile` stream lands in the same
# bucket); `post` two per post. PowerSync stops syncing EVERYTHING for a
# connection past api.parameters.max_buckets_per_connection (service.yaml) —
# never key a bucket on something a user can have unboundedly many of.
#
# Writing a query: a subquery must narrow by an equality on the parameter
# (e.g. `id = subscription.parameter('user_id')`), or the server looks up
# every row it matches for every subscriber — the `public_profile` and
# `*_owner` lookups below are one row each.
#
# Timestamps stay in the pre-streams format ('2026-10-31 12:00:00.123Z'):
# the app compares them as text against SQLite's current_timestamp.
#
# DEPLOY WARNING: any change to this file makes PowerSync re-snapshot every
# table with a plain SELECT, which is subject to RLS. The `powersync` role
# MUST have BYPASSRLS (sql/powersync-bypassrls.sql), or owner-only tables
# snapshot empty and vanish from every device. Check bucket counts after.
config:
  edition: 3
  timestamps_iso8601: false
  custom_postgres_types: false

with:
  followings: SELECT subscribed_to_id FROM subscriptions WHERE subscriber_id = auth.user_id() AND status = 'accepted'
  public_profile: SELECT id FROM profiles WHERE id = subscription.parameter('user_id') AND is_private = false

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT id, email, birthday, gender, push_token, last_seen_at FROM profiles AS my_profile WHERE id = auth.user_id()
      - SELECT * FROM likes WHERE user_id = auth.user_id()
      - SELECT * FROM saved_posts WHERE user_id = auth.user_id()
      - SELECT * FROM saved_profiles WHERE saver_id = auth.user_id()
      - SELECT * FROM archived_posts WHERE user_id = auth.user_id()
      - SELECT * FROM subscriptions WHERE subscriber_id = auth.user_id()
      - SELECT * FROM subscriptions WHERE subscribed_to_id = auth.user_id()
      - SELECT * FROM blocked_users WHERE blocker_id = auth.user_id()
      - SELECT * FROM blocked_users WHERE blocked_id = auth.user_id()
      - SELECT * FROM referrals WHERE referrer_id = auth.user_id()
      - SELECT * FROM story_views WHERE story_owner_id = auth.user_id()
      - SELECT * FROM stories WHERE user_id = auth.user_id()
      - SELECT * FROM notifications WHERE recipient_id = auth.user_id()

  # Keep `authors` and `profile` the same list of queries: that is what makes
  # them share one bucket per author. The profile columns are the public ones
  # (packages/shared .../schema.dart); private ones are `my_profile` above.
  authors:
    auto_subscribe: true
    queries:
      - SELECT id, full_name, username, avatar_url, referral_tier, referral_tier_expires_at, bio, is_private, telegram, website, instagram, onboarded_at, notifications_seen_at FROM profiles WHERE id = auth.user_id() OR id IN followings
      - SELECT * FROM profile_stats WHERE id = auth.user_id() OR id IN followings
      - SELECT * FROM posts WHERE user_id = auth.user_id() OR user_id IN followings
      - SELECT * FROM post_stats WHERE user_id = auth.user_id() OR user_id IN followings
      - SELECT * FROM stories WHERE visibility = 'public' AND (user_id = auth.user_id() OR user_id IN followings)
      - SELECT * FROM story_highlights WHERE user_id = auth.user_id() OR user_id IN followings
      - SELECT * FROM story_highlight_items WHERE user_id = auth.user_id() OR user_id IN followings
      - SELECT * FROM location_stories WHERE user_id = auth.user_id() OR user_id IN followings
      - SELECT * FROM visited_regions WHERE user_id = auth.user_id() OR user_id IN followings

  # Subscription parameters are the app's to choose; what keeps these safe is
  # the check inside each query (a public account, or a follow the server
  # holds), not the parameter.
  profile:
    accept_potentially_dangerous_queries: true
    queries:
      - SELECT id, full_name, username, avatar_url, referral_tier, referral_tier_expires_at, bio, is_private, telegram, website, instagram, onboarded_at, notifications_seen_at FROM profiles WHERE id IN public_profile
      - SELECT * FROM profile_stats WHERE id IN public_profile
      - SELECT * FROM posts WHERE user_id IN public_profile
      - SELECT * FROM post_stats WHERE user_id IN public_profile
      - SELECT * FROM stories WHERE visibility = 'public' AND user_id IN public_profile
      - SELECT * FROM story_highlights WHERE user_id IN public_profile
      - SELECT * FROM story_highlight_items WHERE user_id IN public_profile
      - SELECT * FROM location_stories WHERE user_id IN public_profile
      - SELECT * FROM visited_regions WHERE user_id IN public_profile

  profile_card:
    accept_potentially_dangerous_queries: true
    queries:
      - SELECT id, full_name, username, avatar_url, referral_tier, referral_tier_expires_at, bio, is_private, telegram, website, instagram, onboarded_at, notifications_seen_at FROM profiles WHERE id = subscription.parameter('user_id')
      - SELECT * FROM profile_stats WHERE id = subscription.parameter('user_id')

  # The app passes the post's author as `owner_id`; the queries only match
  # rows whose author it really is.
  post:
    accept_potentially_dangerous_queries: true
    with:
      followed_owner: SELECT subscribed_to_id FROM subscriptions WHERE subscriber_id = auth.user_id() AND subscribed_to_id = subscription.parameter('owner_id') AND status = 'accepted'
      public_owner: SELECT id FROM profiles WHERE id = subscription.parameter('owner_id') AND is_private = false
    queries:
      - SELECT * FROM comments WHERE post_id = subscription.parameter('post_id') AND (post_owner_id = auth.user_id() OR post_owner_id IN followed_owner OR post_owner_id IN public_owner)
      - SELECT * FROM posts WHERE id = subscription.parameter('post_id') AND (user_id = auth.user_id() OR user_id IN followed_owner OR user_id IN public_owner)
      - SELECT * FROM post_stats WHERE id = subscription.parameter('post_id') AND (user_id = auth.user_id() OR user_id IN followed_owner OR user_id IN public_owner)
