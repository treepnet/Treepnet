# Sync-rule docs: https://docs.powersync.com/usage/sync-rules
#
# Privacy model:
#   * Public social data (profiles, posts, likes, comments, stories, media,
#     subscriptions) syncs to everyone — this is what powers search, the feed
#     and discovery, like a public Instagram.
#   * The signed-in user's id lives in the Entra id token's `oid` claim (its
#     `sub` is not a plain UUID), so parameter queries read it with
#     `request.user_id()`.
#   * Direct messages are NOT synced by PowerSync: chat runs on the self-hosted
#     Socket.IO backend (lib/chat). The legacy `user_conversations` and
#     `global_attachments` buckets were removed on 2026-10-10 — nothing in the
#     app read them any more.
#
# DEPLOY WARNING: any change to this file makes PowerSync create a new sync-
# rules version and re-snapshot every table with a plain SELECT, which is
# subject to RLS. The `powersync` DB role MUST have BYPASSRLS
# (sql/powersync-bypassrls.sql), otherwise owner-only tables (referrals,
# saved_posts, saved_profiles, blocked_users, archived_posts) snapshot empty
# and those rows vanish from every device.
#
# Notes on PowerSync limits (learned from validation):
#   * A parameter query may SELECT from only ONE table — no JOINs. When a row
#     needs scoping by something on another table, denormalise it onto the row
#     server-side (e.g. story_views.story_owner_id, set by a trigger —
#     sql/story_views_owner.sql).
#   * PowerSync caps one connection at 1,000 buckets and stops syncing
#     EVERYTHING for that user past it. Never parameterise a bucket per item a
#     user owns (per story, per conversation); use one bucket per user.
#   * `blocked_users` is private to the blocker.
bucket_definitions:
  global_media:
    data:
        - select * from images
        - select * from videos
  global_posts:
    data:
        - select * from posts
        - select * from likes
        - select * from comments
  global_stories:
    data:
        - select * from stories
  # Which archived stories a traveller pinned to a place — public, like posts.
  global_location_stories:
    data:
        - select * from location_stories
  global_profiles:
    data:
        - select * from profiles
  global_subscriptions:
    data:
        - select * from subscriptions
  # Story likes are public (a story shows its like count to everyone).
  global_story_likes:
    data:
        - select * from story_likes
  # Visited regions colour a profile's travel map, so they are public like
  # posts — every device needs them to render someone else's map.
  global_visited_regions:
    data:
        - select * from visited_regions
  # Highlights are part of a public profile, like posts.
  global_story_highlights:
    data:
        - select * from story_highlights
        - select * from story_highlight_items
  # Who viewed the signed-in user's own stories — the "seen by" list. Only the
  # author receives these rows, in ONE bucket per user (story_owner_id is set
  # server-side), so the bucket count no longer grows with every story posted.
  user_story_views:
    parameters: select request.user_id() as user_id
    data:
        - select * from story_views where story_owner_id = bucket.user_id
  user_saved_posts:
    parameters: select request.user_id() as user_id
    data:
        - select * from saved_posts where user_id = bucket.user_id
        - select * from saved_profiles where saver_id = bucket.user_id
  user_archived_posts:
    parameters: select request.user_id() as user_id
    data:
        - select * from archived_posts where user_id = bucket.user_id
  user_blocked_users:
    parameters: select request.user_id() as user_id
    data:
        - select * from blocked_users where blocker_id = bucket.user_id
  # The blocked party also needs their block rows, so the app can present the
  # blocker as private and block messaging for them.
  user_blocked_by:
    parameters: select request.user_id() as user_id
    data:
        - select * from blocked_users where blocked_id = bucket.user_id
  user_referrals:
    parameters: select request.user_id() as user_id
    data:
        - select * from referrals where referrer_id = bucket.user_id
