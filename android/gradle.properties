org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 (Flutter 3.50 needs it) with its new DSL and built-in Kotlin off,
# as in Flutter's own template: plugins that dropped the Kotlin plugin get
# it applied by Flutter's Gradle plugin.
android.newDsl=false
android.builtInKotlin=false
