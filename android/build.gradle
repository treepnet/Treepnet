allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.value(rootProject.layout.projectDirectory.dir('../build'))
subprojects {
    // Guard: newer plugins finish evaluating before this root hook runs, and
    // registering afterEvaluate on an already-evaluated project throws.
    if (!project.state.executed) {
      afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            Integer pluginCompileSdk = project.android.compileSdk
            // Plugins still compiled against an older SDK (blurhash: 31,
            // messenger_chat: 35) fail the release build's AAR metadata check:
            // the libraries they now get (AndroidX, flutter_secure_storage)
            // need 34-36. Compiling them against 36 changes nothing at runtime
            // (targetSdk/minSdk are untouched).
            if (pluginCompileSdk != null && pluginCompileSdk < 36) {
                project.logger.warn(
                        "Overriding compileSdk in Flutter plugin " + project.name
                                + " from " + pluginCompileSdk + " to 36."
                )
                project.android {
                    compileSdk 36
                }
            }
            // Align every plugin module's JVM target to 17. Some plugins
            // (photo_manager et al.) default to Java 8, which clashes with
            // Kotlin 17 -> "Inconsistent JVM-target compatibility" build error.
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                }
            }
        }
      }
    }

    project.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(project.name))
    if (!project.state.executed) {
      project.evaluationDependsOn(":app")
    }
}
tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
