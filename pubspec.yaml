name: treepnet
description: A complete offline-first Flutter Instagram clone with Supabase and PowerSync.
version: 1.0.8+8
publish_to: none

environment:
  sdk: ">=3.9.0"
  flutter: ">=3.35.7"

dependencies:
  geolocator: ^13.0.1
  exif: ^3.3.0
  animations: ^2.0.11
  app_links: ^6.3.2
  # Android deferred deep link: reads the Play Store install referrer so an
  # invite works even when the app wasn't installed when the link was tapped.
  android_play_install_referrer: ^0.4.0
  app_ui:
    path: packages/app_ui
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  bloc: ^9.1.0
  cached_network_image: ^3.4.1
  # Story camera. Deliberately its own dependency: the story viewfinder is a
  # separate screen from the New post one, so neither can break the other.
  # Vendored from pub camera 0.11.0+2 so the plugin can't shift under us.
  camera:
    path: packages/camera
  collection: ^1.18.0
  database_client:
    path: packages/database_client
  # Crash logger context (app version + device model/OS). Already resolved
  # transitively; pinned here as direct deps for the reporter.
  device_info_plus: ^11.3.0
  package_info_plus: ^9.0.0
  # Chat backend transport (messenger_chat plugin talks to our OCI Node/Socket.IO
  # service through these). Versions match what the plugin already resolves.
  dio: ^5.8.0+1
  socket_io_client: ^3.1.2
  equatable: ^2.0.7
  # Push notifications (FCM transport only — see PUSH_NOTIFICATIONS_PLAN.md).
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  form_fields:
    path: packages/form_fields
  go_router: ^14.2.7
  hydrated_bloc: ^10.1.1
  insta_blocks:
    path: packages/insta_blocks
  instagram_blocks_ui:
    path: packages/instagram_blocks_ui
  intl: ^0.20.2
  inview_notifier_list:
    git:
      url: https://github.com/Gambley1/inview_notifier_list
      # The commit in use: a git dependency without a ref takes whatever
      # the branch holds at the next install.
      ref: 8b27aa2dcfda32af8b0da76f8230c3ca1af3cb6c
  json_annotation: ^4.9.0
  lottie: ^3.1.2
  path_provider: ^2.1.5
  persistent_storage:
    path: packages/storage/persistent_storage
  posts_repository:
    path: packages/posts_repository
  powersync_repository:
    path: packages/powersync_repository
  qr_flutter: ^4.1.0
  scrollable_positioned_list: ^0.3.8
  search_repository:
    path: packages/search_repository
  shared_preferences: ^2.3.2
  shared:
    path: packages/shared
  shimmer: ^3.0.0
  sliver_tools: ^0.2.12
  sprung: ^3.0.1
  stories_editor:
    path: packages/stories_editor
  stories_repository:
    path: packages/stories_repository
  story_view:
    path: packages/story_view
  styled_text:
    git:
      ref: 91272c4779123570a642b19f96214adef2e850b4
      url: https://github.com/Maatteogekko/styled_text_package
      path: styled_text
  firebase_authentication_client:
    path: packages/authentication_client/firebase_authentication_client
  messenger_chat:
    path: packages/messenger_chat
  token_storage:
    path: packages/authentication_client/token_storage
  url_launcher: ^6.3.2
  user_repository:
    path: packages/user_repository

dependency_overrides:
  fading_edge_scrollview: ^4.1.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.6.0
  build_verify: ^3.1.1
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  http: ^1.5.0
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.jpg"

flutter:
  uses-material-design: true
  generate: true
  assets:
    # world_geo.bin is built from world_admin1/world_countries.min.json (the
    # editable sources, not bundled) by scripts/build_geo_bin.py.
    - assets/geo/world_geo.bin
    - assets/geo/country_names.min.json
