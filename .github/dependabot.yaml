version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/app_ui"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/authentication_client/authentication_client"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/authentication_client/token_storage"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/database_client"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/env"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/storage/storage"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/storage/secure_storage"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/storage/persistent_storage"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/insta_blocks"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/instagram_blocks_ui"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/posts_repository"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/powersync_repository"
    schedule:
      interval: "daily"
    # powersync 1.17+ doesn't compile on the Flutter SDK in use (Dart 3.9);
    # upgrade it together with Flutter (packages/*/pubspec.yaml).
    ignore:
      - dependency-name: "powersync"
      - dependency-name: "powersync_core"
      - dependency-name: "powersync_flutter_libs"
  - package-ecosystem: "pub"
    directory: "/packages/search_repository"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/shared"
    schedule:
      interval: "daily"
    # powersync 1.17+ doesn't compile on the Flutter SDK in use (Dart 3.9);
    # upgrade it together with Flutter (packages/*/pubspec.yaml).
    ignore:
      - dependency-name: "powersync"
      - dependency-name: "powersync_core"
      - dependency-name: "powersync_flutter_libs"
  - package-ecosystem: "pub"
    directory: "/packages/stories_repository"
    schedule:
      interval: "daily"
  - package-ecosystem: "pub"
    directory: "/packages/user_repository"
    schedule:
      interval: "daily"
